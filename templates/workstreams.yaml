# Workstreams — <Project> · single source of the workstreams
#
# This file is THE source: workstreams.html (the fixed page, published as an artifact)
# and workstreams.json (its data, next to it: only the open workstreams, in short
# fields) are derived from it. The checkpoint's queue, for its part, is written by
# hand: check 9 of the checker cross-checks it with this file.
# A workstream that is not here does not exist. Every write to this file
# regenerates both files, in the same move:
# python3 -B make_board.py workstreams.yaml workstreams.html
#
# It is valid YAML: a standard YAML reader reads the same values as the living-docs tools
# (check 11 of the checker). A value that contains “:” followed by a space, “#” preceded by
# a space, or that starts with a special character is written in double quotes (only \" and
# \\ are escapes there); “archive_workstreams.py normalize” puts a file in format, touching
# nothing else.
#
# Deliberately poor form: an entry starts with “- id:”, everything
# else fits on ONE line “key: value”. No folded blocks.
#
#   status     : upcoming | to-brief | in-flight | debt | accepted
#                (accepted = delivered and validated; the entry stays for the delay of the method §6, then goes to the archives)
#   accepted-on: the date it became accepted, set by archive_workstreams.py (never written or corrected by hand);
#                once that delay is over, the entry moves out to <Folder>/Archives/WORKSTREAMS_<YYYY-MM>.yaml — to find it again:
#                python3 -B archive_workstreams.py search <id or word> --workstreams workstreams.yaml --archives Archives
#   module     : <module-1> | <module-2> | core | tooling | doc | operations
#   category   : screen | data | engine | tooling | doc | operations
#   priority   : high | medium | low
#   complexity : high | medium | low
#   rank       : order of value within a status (optional)
#   pl         : the PL holding the workstream in flight — required when in-flight (method §1a)
#   deliverable: the code repository the release comes out of; one batch in flight per deliverable, pushing the in-flight entry takes it
#   waits      : the id of the batch in flight this suspended batch waits for (same deliverable or same resource)
#   resource   : a shared resource occupied during the flight (the owner's machine, a game…); one batch in flight per resource
#   version    : computed when the batch takes the deliverable (the rule of the method §1a, never `main` plus one),
#                announced in the brief — only for a deliverable deployed per batch; a batch of a
#                deliverable published by release has no `version:` (it completes the “Unreleased” section of the
#                CHANGELOG; the release is made at the owner's request)
#   for        : the PL a workstream from another domain is addressed to, read after every pull
#   touches    : the files or modules of another domain the batch will touch
#   cost       : what it will cost (upcoming); once delivered, the batch's cost is in the plan's version log, not here
#   done       : at close-out, one line: the date and the version (or the batch's name) — the batch's detail (dev,
#                duration, stops, acceptance, fingerprint) is written once, in the plan's version log (method §6)
#   basis      : what the workstream rests on — the owner's request, the measurement, the defect seen
#   refs       : D from the decision log · brief · report · other workstreams
#
# An entry fits under the cap of the method §6: the state, the decision, the next move. A long exchange goes to the batch folder or into a
# domain note; the entry only keeps the summary and the path (method §6, “the caps”).
#
# Labels displayed by the page (optional; otherwise the value itself):
# label: <module-1> = <Module 1 label>

# ─────────────────────────────── Tooling ────────────────────────────────────

- id: bench-v1
  title: The test bench — measuring an archive cold
  module: tooling
  category: tooling
  status: to-brief
  priority: high
  complexity: medium
  rank: 1
  cost: a tooling batch, short brief from the PL, dev Sonnet High
  basis: Without a test bench, no gate can be measured. The base ritual (file count, tests, lint, output syntax, i18n, code fingerprint), the common base → delivery measurement (exact list of changed files), and whatever else the project requires.
  refs: D1

