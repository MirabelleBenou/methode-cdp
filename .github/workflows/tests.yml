name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install PyYAML (only for the tests that compare with a standard YAML parser)
        run: python3 -m pip install pyyaml
      - name: French tests (fr/; the links and parity tests included)
        run: python3 -B -m unittest discover -s fr/modeles/tests -t .
      - name: English tests (the links and parity tests included)
        run: python3 -B -m unittest discover -s templates/tests -t .
      - name: Server runner tests
        run: cd templates/server-runner && python3 -B -m unittest discover -s tests
