name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: French tests (fr/)
        run: python3 -B -m unittest discover -s fr/modeles/tests -t .
      - name: English tests
        run: python3 -B -m unittest discover -s templates/tests -t .
      - name: Server runner tests
        run: cd templates/server-runner && python3 -B -m unittest discover -s tests
